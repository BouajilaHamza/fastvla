name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'
      title:
        description: 'Release title'
        required: true
        default: 'v0.3.0 — Sprint 1: Action Heads, L4/T4 Memory+Speed Optimizations'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.tag }} HEAD
          git push origin ${{ github.event.inputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: |
            ## What's New in v0.3.0 — Sprint 1

            Full rigorous review and optimization pass targeting the two project KPIs: **memory** and **speed** on L4/T4 GPUs. All numbers are reproducible via `examples/modal_smoke_benchmark.py`.

            ---

            ### Measured Results (Sprint 1, Modal L4)

            | Model | GPU | Train it/s | Peak VRAM | Inference Hz |
            | :--- | :--- | :--- | :--- | :--- |
            | OpenVLA-7B (4-bit + LoRA) | L4 | **14.29 it/s** | 4.87 / 5.26 GB | 18.8 Hz |
            | OpenVLA-7B (4-bit + LoRA) | T4 | 4.11 it/s | 5.45 / 5.64 GB | 4.4 Hz |
            | SmolVLA (4-bit + LoRA) | L4 | **22.35 it/s** | 1.71 / 3.28 GB | 42.5 Hz |
            | SmolVLA (4-bit + LoRA) | T4 | 6.49 it/s | 1.71 / 3.29 GB | — |

            Vanilla bf16 OpenVLA-7B **OOMs at 22 GB** on L4. FastVLA trains the same model at **14.3 it/s / 5.2 GB peak**.
            **2.60× faster inference, 65% less VRAM** vs the OpenVLA paper's L4 bf16 baseline.

            ---

            ### Action Heads (`fastvla/adapters/action_head.py`)
            - **DiscreteActionHead**: Fixed train/inference distribution shift via straight-through estimator. Added cross-entropy loss over bins.
            - **FlowMatchingActionHead**: Replaced non-functional MLP stub with real conditional flow matching — time-conditioned velocity field, linear-path CFM loss, Euler ODE integration.
            - Added `compute_loss()` protocol for head-specific objectives.

            ### Triton Action Head (`fastvla/kernels/action_head.py`)
            - Backward pass caches `h1`/output instead of recomputing the full forward chain.
            - Fused Triton kernel reserved for grad-free inference only.
            - Dtype casts only on actual mismatch (was allocating new tensors every step).

            ### Model / Unsloth (`fastvla/model.py`)
            - **Skip LM head in forward pass** (`_encode_sequence`): calls transformer trunk directly, avoiding `[B, T, ~128k]` logits materialization on every step.
            - **`nn.ModuleList` truncation bug fixed**: list slicing was silently dropping layers from parameter registry and `state_dict`.
            - **Turing-aware attention**: `sdpa` on T4 (sm_75), `flash_attention_2` on Ada/Ampere (sm_80+).
            - **Freeze vision encoder by default** (`config.freeze_vision_encoder=True`).
            - **`torch.compile` auto-enabled on Ada (sm_89) / Hopper (sm_90+)**.
            - **Masked-mean pooling** replaces plain mean (ignores padding tokens).
            - **Balanced multi-GPU device map** for real sharding.

            ### Training (`fastvla/training.py`)
            - **Gradient/activation checkpointing actually enabled** — was declared but never wired up. ~30–40% activation memory reduction.
            - **DataLoader `num_workers=4` + `pin_memory` + `persistent_workers`**: `num_workers=0` was starving the GPU.
            - `weight_decay` threaded through optimizer (was hardcoded).

            ### Optimization (`fastvla/optimization.py`)
            - **PagedAdamW8bit** preferred: optimizer state paged to CPU under memory pressure.

            ### Benchmarking
            - `examples/modal_smoke_benchmark.py`: reproducible L4+T4 parallel benchmark with W&B logging.
            - `examples/update_readme_benchmarks.py`: patches README with verified numbers.

            ### Bug Fixes (resolves Issues #1 and #2)
            - **Issue #1** (false benchmark claims): all numbers now measured and reproducible.
            - **Issue #2** (architectural bugs: double loading, `is_quantized`, fusion mismatch): all resolved.

            ---

            ### Upgrade
            ```bash
            pip install --upgrade fastvla
            # or
            git pull origin main
            uv sync
            ```

            **Full changelog:** https://github.com/BouajilaHamza/fastvla/compare/v0.2.1...v0.3.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
